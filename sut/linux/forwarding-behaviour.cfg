#!/bin/bash

###############################################
####### some definitions for the script #######
###############################################

SUT_rcv_iface_name="enp6s0f0"
SUT_rcv_iface_ipv4_addr="10.10.1.2"
SUT_rcv_iface_ipv4_plen="24"
SUT_rcv_iface_ipv6_addr="12:1::2"
SUT_rcv_iface_ipv6_plen="64"

SUT_snd_iface_name="enp6s0f1"
SUT_snd_iface_ipv4_addr="10.10.2.2"
SUT_snd_iface_ipv4_plen="24"
SUT_snd_iface_ipv6_addr="12:2::2"
SUT_snd_iface_ipv6_plen="64"

TG_rcv_iface_ipv4_addr="10.10.2.1"
TG_rcv_iface_ipv4_plen="24"
TG_rcv_iface_ipv6_addr="12:2::1"
TG_rcv_iface_ipv6_plen="64"

pkt_ipv6_dst_addr="B::2"
pkt_ipv6_dst_plen="64"

pkt_ipv4_dst_addr="48.0.0.0"
pkt_ipv4_dst_plen="24"

srv6_1st_sid="F1::"
srv6_2nd_sid="F2::"
srv6_srh2_sid="F3::"

rt_table_2="100"

# SRv6 Mobile User Plane (RFC 9433) -- prefixes used by the H.M.GTP4.D
# / End.M.GTP{4,6}.{D,D.Di,E} behaviours.  Kept disjoint from the
# SRPerf "F::/16" SID space above so MUP and classic experiments do
# not collide on the SUT routing table.
#   * mup_v4_locator -- SID locator for the IPv4-touching behaviours
#     (H.M.GTP4.D / End.M.GTP4.E).  /32 per RFC 9433 mapping.
#   * mup_v6_locator -- SID locator for the IPv6-touching behaviours
#     (End.M.GTP6.D / End.M.GTP6.D.Di / End.M.GTP6.E).
#   * mup_gtp4_match -- IPv4 prefix on the SUT_rcv side that triggers
#     H.M.GTP4.D (i.e. dst of the outer GTP-U/IPv4 frame from TG).
mup_v4_locator="2001:db8::"
mup_v4_locator_plen="32"
mup_v6_locator="2001:db8:f::"
mup_v6_locator_plen="64"
mup_gtp4_match="10.99.0.0"
mup_gtp4_match_plen="24"
#   * mup_d_seg -- SRH segment template for End.M.GTP6.D.  The action
#     rewrites the segment's bytes [sr_prefix_len/8 ..] with
#     Args.Mob.Session, so the segment must live on a dedicated
#     routed prefix (NOT the directly-connected /64, whose rewritten
#     addresses would need per-address neigh entries, and NOT the
#     match prefix, which would loop back into the D rule).
mup_d_seg="2001:db8:d::1"
mup_d_seg_pfx="2001:db8:d::"
mup_d_seg_plen="64"

declare -a behaviour_arr=(
			"ipv4"
			"ipv6"
			"t_encaps_v6"
			"t_encaps_l2"
			"t_insert_v6"
			"end"
			"end_x"
			"end_t"
			"end_dx6"
			"end_dx2"
			"end_dt6"
			"h_m_gtp4_d"
			"end_m_gtp4_e"
			"end_m_gtp6_d"
			"end_m_gtp6_d_di"
			"end_m_gtp6_e"
);

usage() {
echo ""
echo "+---------------------------------------------------------------+"
echo "+------------------+ SUT forwarding config +--------------------+"
echo "+---------------------------------------------------------------+"
echo "+-- This script configures the forwarding behaviour at SUT -----+"
echo "+-- It is used for the Linux SRv6 performance experiment      --+"
echo "+-- $ ./forwarding-behaviour.cfg BEHAVIOUR                    --+"
echo "+-- BEHAVIOUR: ipv4        | ipv6          | t_encaps_v6 |    --+"
echo "+--            t_encaps_v4 | t_encaps_l2   | t_insert_v6 |    --+"
echo "+--            end         | end_x         | end_t       |    --+"
echo "+--            end_b6      | end_b6_encaps | end_dx6     |    --+"
echo "+--            end_dx4     | end_dx2       | end_dt6     |    --+"
echo "+--            end_ad6     | end_ad4       | end_am           --+"
echo "+-- RFC 9433 (Mobile User Plane):                              --+"
echo "+--            h_m_gtp4_d   | end_m_gtp4_e  | end_m_gtp6_d    --+"
echo "+--            end_m_gtp6_d_di              | end_m_gtp6_e    --+"
echo "+----------------------------------------------------------------+"
echo ""
exit
}

enable_ipv4_forwarding() {
sysctl -w net.ipv4.conf.all.forwarding=1
}

enable_ipv6_forwarding() {
sysctl -w net.ipv6.conf.all.forwarding=1
}

clean_ipv4_routes() {
ip -4 route del $pkt_ipv4_dst_addr/$pkt_ipv4_dst_plen >> /tmp/clean-cfg.log 2>&1 >> /tmp/clean-cfg.log
}

clean_ipv6_routes() {
ip -6 route del $pkt_ipv6_dst_addr/$pkt_ipv6_dst_plen >> /tmp/clean-cfg.log 2>&1 >> /tmp/clean-cfg.log
ip -6 route del $pkt_ipv6_dst_addr/$pkt_ipv6_dst_plen table $rt_table_2 >> /tmp/clean-cfg.log 2>&1 >> /tmp/clean-cfg.log
ip -6 route del $srv6_1st_sid >> /tmp/clean-cfg.log 2>&1 >>/tmp/clean-cfg.log
ip -6 route del $srv6_2nd_sid >> /tmp/clean-cfg.log 2>&1 >>/tmp/clean-cfg.log
ip -6 route del $srv6_srh2_sid >> /tmp/clean-cfg.log 2>&1 >>/tmp/clean-cfg.log
ip -6 route del $srv6_2nd_sid table $rt_table_2 >> /tmp/clean-cfg.log 2>&1 >>/tmp/clean-cfg.log
}

clean_mup_routes() {
ip -4 route del $mup_gtp4_match/$mup_gtp4_match_plen >> /tmp/clean-cfg.log 2>&1 >> /tmp/clean-cfg.log
ip -6 route del $mup_v4_locator/$mup_v4_locator_plen >> /tmp/clean-cfg.log 2>&1 >> /tmp/clean-cfg.log
ip -6 route del $mup_v6_locator/$mup_v6_locator_plen >> /tmp/clean-cfg.log 2>&1 >> /tmp/clean-cfg.log
ip -6 route del $mup_d_seg_pfx/$mup_d_seg_plen >> /tmp/clean-cfg.log 2>&1 >> /tmp/clean-cfg.log
}

clean_cfg(){
clean_ipv4_routes
clean_ipv6_routes
clean_mup_routes
}

######## Plain forwarding ########

ipv4_cfg(){
# Plain IPv4 forwarding: TG sends to TG_rcv side, SUT plain-routes via SUT_snd.
ip -4 route add $pkt_ipv4_dst_addr/$pkt_ipv4_dst_plen via $TG_rcv_iface_ipv4_addr
}

ipv6_cfg(){
ip -6 route add $pkt_ipv6_dst_addr/$pkt_ipv6_dst_plen via $TG_rcv_iface_ipv6_addr
}

######## SRv6 Endpoint behaviours ########

end_cfg(){
ip -6 route add $srv6_1st_sid encap seg6local action End dev $SUT_rcv_iface_name
ip -6 route add $srv6_2nd_sid via $TG_rcv_iface_ipv6_addr
}

end_x_cfg(){
ip -6 route add $srv6_1st_sid encap seg6local action End.X nh6 $TG_rcv_iface_ipv6_addr dev $SUT_rcv_iface_name
}

end_t_cfg(){
ip -6 route add $srv6_1st_sid encap seg6local action End.T table $rt_table_2 dev $SUT_rcv_iface_name
ip -6 route add $srv6_2nd_sid via $TG_rcv_iface_ipv6_addr table $rt_table_2
}

######## SRv6 Endpoint with decap behaviours ########

end_dt6_cfg(){
ip -6 route add $srv6_2nd_sid encap seg6local action End.DT6 table $rt_table_2 dev $SUT_rcv_iface_name
ip -6 route add $pkt_ipv6_dst_addr/$pkt_ipv6_dst_plen via $TG_rcv_iface_ipv6_addr table $rt_table_2
}

end_dx2_cfg(){
ip -6 route add $srv6_2nd_sid encap seg6local action End.DX2 oif $SUT_snd_iface_name dev $SUT_rcv_iface_name
}

end_dx6_cfg(){
ip -6 route add $srv6_2nd_sid encap seg6local action End.DX6 nh6 $TG_rcv_iface_ipv6_addr dev $SUT_rcv_iface_name
}

######## SRv6 Transit behaviours ########

t_encaps_l2_cfg(){
ip -6 route add $pkt_ipv6_dst_addr/$pkt_ipv6_dst_plen encap seg6 mode l2encap segs $srv6_1st_sid  dev $SUT_rcv_iface_name
ip -6 route add $srv6_1st_sid via $TG_rcv_iface_ipv6_addr
}

t_encaps_v6_cfg(){
ip -6 route add $pkt_ipv6_dst_addr/$pkt_ipv6_dst_plen encap seg6 mode encap segs $srv6_1st_sid  dev $SUT_rcv_iface_name
ip -6 route add $srv6_1st_sid via $TG_rcv_iface_ipv6_addr
}

t_insert_v6_cfg(){
ip -6 route add $pkt_ipv6_dst_addr/$pkt_ipv6_dst_plen encap seg6 mode inline segs $srv6_1st_sid  dev $SUT_rcv_iface_name
ip -6 route add $srv6_1st_sid via $TG_rcv_iface_ipv6_addr
}

######## SRv6 Mobile User Plane (RFC 9433) behaviours ########

# UL: GTP-U/IPv4 -> SRv6.  TG sends GTP-U with outer IPv4 dst inside
# $mup_gtp4_match/$mup_gtp4_match_plen on the SUT_rcv interface.  After
# H.M.GTP4.D the SUT emits SRv6 whose outer dst is the first SRH
# segment -- pointed straight at TG_rcv, so no extra locator route is
# needed.  (seg6mobile grammar: srh segs replaces the old nh6.)
h_m_gtp4_d_cfg(){
# The segment template is the GTP4 locator itself: the action embeds
# the original IPv4 DA + Args.Mob.Session after sr_prefix_len bits,
# and the /32 locator route below catches every rewritten address.
ip -4 route add $mup_gtp4_match/$mup_gtp4_match_plen \
	encap seg6mobile action H.M.GTP4.D \
	srh segs $mup_v4_locator \
	src $SUT_snd_iface_ipv6_addr \
	sr_prefix_len $mup_v4_locator_plen count \
	via $TG_rcv_iface_ipv4_addr dev $SUT_snd_iface_name
ip -6 route add $mup_v4_locator/$mup_v4_locator_plen via $TG_rcv_iface_ipv6_addr
}

# DL: SRv6 -> GTP-U/IPv4.  TG sends SRv6 with outer dst inside
# $mup_v4_locator/$mup_v4_locator_plen (v4_mask_len=32 -- IPv4 dst encoded
# at bytes 4..7 of the SID).  End.M.GTP4.E recovers the IPv4 dst and emits
# GTP-U/IPv4 out the SUT_snd interface.
end_m_gtp4_e_cfg(){
ip -6 route add $mup_v4_locator/$mup_v4_locator_plen \
	encap seg6mobile action End.M.GTP4.E \
	sr_prefix_len $mup_v4_locator_plen pdu_type dl \
	dev $SUT_rcv_iface_name
}

# UL: GTP-U/IPv6 -> SRv6.  TG sends GTP-U/IPv6 with outer dst inside
# $mup_v6_locator/$mup_v6_locator_plen on the SUT_rcv interface.  After
# End.M.GTP6.D the SUT emits SRv6 with the first SRH segment as outer dst;
# we point that segment at TG via $TG_rcv_iface_ipv6_addr.  Action
# rewrites bytes 8..12 of the segment with Args.Mob.Session, so the
# routed segment prefix must NOT overlap the directly-connected /64.
end_m_gtp6_d_cfg(){
ip -6 route add $mup_v6_locator/$mup_v6_locator_plen \
	encap seg6mobile action End.M.GTP6.D \
	srh segs $mup_d_seg \
	src $SUT_snd_iface_ipv6_addr \
	sr_prefix_len $mup_d_seg_plen count \
	via $TG_rcv_iface_ipv6_addr dev $SUT_snd_iface_name
ip -6 route add $mup_d_seg_pfx/$mup_d_seg_plen via $TG_rcv_iface_ipv6_addr
}

# UL drop-in: original outer IPv6 destination is preserved as the final
# SRH segment; a single segment back toward TG closes the loop.
end_m_gtp6_d_di_cfg(){
ip -6 route add $mup_v6_locator/$mup_v6_locator_plen \
	encap seg6mobile action End.M.GTP6.D.Di \
	srh segs $TG_rcv_iface_ipv6_addr \
	src $SUT_snd_iface_ipv6_addr count \
	via $TG_rcv_iface_ipv6_addr dev $SUT_snd_iface_name
}

# DL: SRv6 -> GTP-U/IPv6.  TG sends SRv6 with outer dst inside
# $mup_v6_locator/$mup_v6_locator_plen; the SRH first segment carries the
# GTP-U IPv6 destination, which we expect to be $TG_rcv_iface_ipv6_addr.
end_m_gtp6_e_cfg(){
ip -6 route add $mup_v6_locator/$mup_v6_locator_plen \
	encap seg6mobile action End.M.GTP6.E \
	sr_prefix_len $mup_v6_locator_plen \
	src $SUT_snd_iface_ipv6_addr pdu_type dl \
	dev $SUT_rcv_iface_name
}

###############################################
######### start of script execution ###########
###############################################

if [ $# -eq 0 ]
	then
	echo "ERROR: No specified behaviour! "
	echo "For the list of supported behaviour please try \"./$0 help\" "
	exit
fi

if [ $1 = "help" ]
	then
	usage
fi

if [ $1 = "clean" ]
        then
        clean_cfg
	exit
fi

if [ $# -gt 1 ]
	then
	echo "ERROR: too many parameters. please try \"$0 help\" "
	exit
fi

BEHAVIOUR=$1

for i in "${behaviour_arr[@]}"
do
	if [ "$i" = ${BEHAVIOUR} ] ; then
		clean_cfg
		${BEHAVIOUR}_cfg
		exit
	fi
done

echo "ERROR: behaviour \"${BEHAVIOUR}\" is not supported. please try \"$0 help\" "
